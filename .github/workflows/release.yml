name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/**"
      - ".docker/**"
  schedule:
    - cron: "25 5 * * *"

jobs:
  latest-alpine:
    uses: ./.github/workflows/publish.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PAT: ${{ secrets.DOCKERHUB_PAT }}
    with:
      neovim_version: stable
      image_version: latest,latest-alpine,{version_major}-alpine,{version_major}.{version_minor}-alpine,{version_major}.{version_minor}.{version_patch}-alpine
      distro_name: alpine
      distro_version: latest

  latest-trixie:
    uses: ./.github/workflows/publish.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PAT: ${{ secrets.DOCKERHUB_PAT }}
    with:
      neovim_version: stable
      image_version: latest-trixie,{version_major}-trixie,{version_major}.{version_minor}-trixie,{version_major}.{version_minor}.{version_patch}-trixie
      distro_name: debian
      distro_version: trixie

  latest-bookworm:
    uses: ./.github/workflows/publish.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PAT: ${{ secrets.DOCKERHUB_PAT }}
    with:
      neovim_version: stable
      image_version: latest-bookworm,{version_major}-bookworm,{version_major}.{version_minor}-bookworm,{version_major}.{version_minor}.{version_patch}-bookworm
      distro_name: debian
      distro_version: bookworm

  nightly-alpine:
    uses: ./.github/workflows/publish.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PAT: ${{ secrets.DOCKERHUB_PAT }}
    with:
      neovim_version: nightly
      image_version: nightly-alpine
      distro_name: alpine
      distro_version: latest

  nightly-trixie:
    uses: ./.github/workflows/publish.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PAT: ${{ secrets.DOCKERHUB_PAT }}
    with:
      neovim_version: nightly
      image_version: nightly-trixie
      distro_name: debian
      distro_version: trixie

  nightly-bookworm:
    uses: ./.github/workflows/publish.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PAT: ${{ secrets.DOCKERHUB_PAT }}
    with:
      neovim_version: nightly
      image_version: nightly-bookworm
      distro_name: debian
      distro_version: bookworm
